<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Background Canvas -->
  <rect width="512" height="512" fill="#04070a" rx="105"/>
  <rect width="512" height="512" fill="url(#cyanGlow)" rx="105"/>

  <!-- Glowing Cyan Rounded Border -->
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="#00f0ff" stroke-width="28" stroke-linecap="round" filter="url(#neonBlur)" />
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="#a5f3fc" stroke-width="6" opacity="0.9" />

  <!-- Stylized eF typography -->
  <g filter="url(#neonBlur)">
    <text x="256" y="320" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="224" font-weight="900" fill="#00f5d4" text-anchor="middle" letter-spacing="-8">eF</text>
  </g>
  <text x="256" y="320" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="224" font-weight="900" fill="#f0fdfa" opacity="0.92" text-anchor="middle" letter-spacing="-8">eF</text>
</svg>
